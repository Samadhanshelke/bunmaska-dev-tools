<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portkill</title>
    <style>
      :root {
        --ink: #14212b;
        --muted: #5c6b76;
        --line: rgba(20, 33, 43, 0.12);
        --panel: rgba(255, 252, 247, 0.82);
        --kill: #c23b22;
        --kill-ink: #fff8f5;
        --ok: #1f6f5b;
        --warn: #9a6b12;
        --teal: #0f4c5c;
        --teal-soft: #1a6b7c;
        --shadow: 0 18px 50px rgba(20, 33, 43, 0.12);
        --mono: "SF Mono", "Menlo", "Monaco", "Cascadia Code", ui-monospace, monospace;
        --sans: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--sans);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(26, 107, 124, 0.18), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(194, 59, 34, 0.1), transparent 45%),
          linear-gradient(165deg, #e7eef2 0%, #f4efe6 48%, #e9e2d6 100%);
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(15, 76, 92, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 76, 92, 0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
        pointer-events: none;
      }

      .shell {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 22px 24px 16px;
        gap: 16px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        animation: rise 420ms ease-out both;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand h1 {
        margin: 0;
        font-size: 2.1rem;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--teal);
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .search {
        width: min(280px, 42vw);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .search input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        font: inherit;
        color: var(--ink);
      }

      .search input::placeholder {
        color: #8a97a1;
      }

      button {
        font: inherit;
        border: 0;
        cursor: pointer;
      }

      .btn {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        box-shadow: var(--shadow);
        transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        border-color: rgba(15, 76, 92, 0.28);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-primary {
        background: var(--teal);
        border-color: transparent;
        color: #f3fafb;
      }

      .btn-primary:hover {
        background: var(--teal-soft);
      }

      .panel {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        animation: rise 520ms ease-out both;
        animation-delay: 60ms;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.86rem;
      }

      .meta strong {
        color: var(--ink);
        font-weight: 600;
      }

      .table-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        text-align: left;
        padding: 12px 16px;
        background: rgba(244, 239, 230, 0.94);
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(20, 33, 43, 0.06);
        vertical-align: middle;
      }

      tr {
        animation: rowIn 280ms ease both;
      }

      tr:hover td {
        background: rgba(15, 76, 92, 0.04);
      }

      .port {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 1.02rem;
        color: var(--teal);
      }

      .pill {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(15, 76, 92, 0.1);
        color: var(--teal);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .mono {
        font-family: var(--mono);
        font-size: 0.86rem;
      }

      .muted {
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .btn-kill {
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        background: var(--kill);
        color: var(--kill-ink);
        font-size: 0.84rem;
        font-weight: 600;
        transition: transform 140ms ease, filter 140ms ease;
      }

      .btn-kill:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      .btn-ghost {
        height: 32px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .btn-ghost:hover {
        color: var(--ink);
        border-color: rgba(20, 33, 43, 0.22);
      }

      .btn-kill:disabled,
      .btn-ghost:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
        filter: none;
      }

      .empty {
        height: 100%;
        min-height: 280px;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }

      .empty h2 {
        margin: 0 0 8px;
        color: var(--ink);
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.8rem;
        animation: rise 600ms ease-out both;
        animation-delay: 100ms;
      }

      kbd {
        font-family: var(--mono);
        font-size: 0.76rem;
        padding: 2px 6px;
        border-radius: 5px;
        border: 1px solid var(--line);
        background: rgba(255, 252, 247, 0.7);
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        min-width: 220px;
        max-width: min(360px, calc(100vw - 40px));
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--ink);
        color: #f5f7f8;
        box-shadow: 0 16px 40px rgba(20, 33, 43, 0.28);
        transform: translateY(20px);
        opacity: 0;
        pointer-events: none;
        transition: transform 220ms ease, opacity 220ms ease;
        z-index: 20;
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      .toast.ok {
        background: var(--ok);
      }

      .toast.err {
        background: var(--kill);
      }

      .confirm {
        position: fixed;
        inset: 0;
        background: rgba(20, 33, 43, 0.35);
        display: none;
        place-items: center;
        z-index: 30;
        padding: 20px;
      }

      .confirm.open {
        display: grid;
        animation: fade 160ms ease;
      }

      .confirm-card {
        width: min(420px, 100%);
        background: #fffdf9;
        border-radius: 16px;
        padding: 22px;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
      }

      .confirm-card h3 {
        margin: 0 0 8px;
        font-size: 1.2rem;
        letter-spacing: -0.02em;
      }

      .confirm-card p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.45;
      }

      .confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">
          <h1>Portkill</h1>
          <p>See what’s holding a port. Free it in one click.</p>
        </div>
        <div class="toolbar">
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input id="filter" type="search" placeholder="Filter port, process, pid…" />
          </label>
          <button class="btn" id="auto" type="button" title="Auto-refresh every 3s">Auto: off</button>
          <button class="btn btn-primary" id="refresh" type="button">Refresh</button>
        </div>
      </header>

      <section class="panel">
        <div class="meta">
          <div><strong id="count">0</strong> listeners</div>
          <div>Updated <span id="updated">—</span></div>
        </div>
        <div class="table-wrap" id="tableWrap">
          <div class="empty" id="empty">
            <div>
              <h2>Scanning ports…</h2>
              <p>Listening TCP sockets will show up here.</p>
            </div>
          </div>
        </div>
      </section>

      <footer>
        <div>Local only · uses <span class="mono">lsof</span> + signals · never phones home</div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span>Summon with <kbd id="shortcut">⌘⇧K</kbd></span>
          <button class="btn-ghost" id="quit" type="button">Quit</button>
        </div>
      </footer>
    </div>

    <div class="toast" id="toast"></div>

    <div class="confirm" id="confirm" role="dialog" aria-modal="true">
      <div class="confirm-card">
        <h3 id="confirmTitle">Kill process?</h3>
        <p id="confirmBody"></p>
        <div class="confirm-actions">
          <button class="btn" id="confirmCancel" type="button">Cancel</button>
          <button class="btn-kill" id="confirmOk" type="button">Kill</button>
        </div>
      </div>
    </div>

    <script>
      const state = {
        ports: [],
        filter: '',
        auto: false,
        timer: null,
        pending: null,
      };

      const els = {
        tableWrap: document.getElementById('tableWrap'),
        empty: document.getElementById('empty'),
        count: document.getElementById('count'),
        updated: document.getElementById('updated'),
        filter: document.getElementById('filter'),
        refresh: document.getElementById('refresh'),
        auto: document.getElementById('auto'),
        toast: document.getElementById('toast'),
        confirm: document.getElementById('confirm'),
        confirmTitle: document.getElementById('confirmTitle'),
        confirmBody: document.getElementById('confirmBody'),
        confirmCancel: document.getElementById('confirmCancel'),
        confirmOk: document.getElementById('confirmOk'),
        shortcut: document.getElementById('shortcut'),
      };

      let toastTimer = null;

      function toast(message, kind = '') {
        els.toast.textContent = message;
        els.toast.className = 'toast show' + (kind ? ' ' + kind : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          els.toast.className = 'toast';
        }, 2400);
      }

      function formatTime(d) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      function matches(row, q) {
        if (!q) return true;
        const hay = [row.port, row.pid, row.name, row.command, row.address, row.user, row.service || '']
          .join(' ')
          .toLowerCase();
        return hay.includes(q);
      }

      function render() {
        const q = state.filter.trim().toLowerCase();
        const rows = state.ports.filter((p) => matches(p, q));
        els.count.textContent = String(rows.length);

        if (!rows.length) {
          els.tableWrap.innerHTML = '';
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML = state.ports.length
            ? '<div><h2>No matches</h2><p>Try another filter.</p></div>'
            : '<div><h2>Nothing listening</h2><p>Your ports are clear. Nice.</p></div>';
          els.tableWrap.appendChild(empty);
          return;
        }

        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr>
              <th>Port</th>
              <th>Process</th>
              <th>PID</th>
              <th>Address</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');

        rows.forEach((row, i) => {
          const tr = document.createElement('tr');
          tr.style.animationDelay = Math.min(i, 12) * 18 + 'ms';
          const blocked = row.protected || row.self;
          tr.innerHTML = `
            <td>
              <span class="port">${row.port}</span>
              ${row.service ? `<span class="pill">${escapeHtml(row.service)}</span>` : ''}
            </td>
            <td>
              <div>${escapeHtml(row.name)}</div>
              <div class="muted mono">${escapeHtml(row.command)}</div>
            </td>
            <td class="mono">${row.pid}</td>
            <td class="mono muted">${escapeHtml(row.address)}</td>
            <td>
              <div class="actions">
                <button class="btn-ghost" data-act="copy" ${blocked ? 'disabled' : ''}>Copy</button>
                <button class="btn-ghost" data-act="force" ${blocked ? 'disabled' : ''}>Force</button>
                <button class="btn-kill" data-act="kill" ${blocked ? 'disabled' : ''}>Kill</button>
              </div>
            </td>
          `;
          tr.querySelectorAll('button').forEach((btn) => {
            btn.addEventListener('click', () => onAction(btn.dataset.act, row));
          });
          tbody.appendChild(tr);
        });

        els.tableWrap.innerHTML = '';
        els.tableWrap.appendChild(table);
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      async function refresh() {
        els.refresh.disabled = true;
        try {
          state.ports = await window.api.listPorts();
          els.updated.textContent = formatTime(new Date());
          render();
        } catch (err) {
          toast(err?.message || String(err), 'err');
        } finally {
          els.refresh.disabled = false;
        }
      }

      function askConfirm(row, force) {
        state.pending = { row, force };
        els.confirmTitle.textContent = force ? 'Force kill process?' : 'Kill process?';
        els.confirmBody.textContent = force
          ? `Send SIGKILL to ${row.name} (pid ${row.pid}) on port ${row.port}. It will not get a chance to clean up.`
          : `Send SIGTERM to ${row.name} (pid ${row.pid}) on port ${row.port}.`;
        els.confirmOk.textContent = force ? 'Force kill' : 'Kill';
        els.confirm.classList.add('open');
      }

      async function onAction(act, row) {
        if (act === 'copy') {
          const cmd = await window.api.killCommand(row.pid, false);
          try {
            await navigator.clipboard.writeText(cmd);
            toast('Copied: ' + cmd, 'ok');
          } catch {
            toast(cmd);
          }
          return;
        }
        if (act === 'kill') askConfirm(row, false);
        if (act === 'force') askConfirm(row, true);
      }

      async function confirmKill() {
        const pending = state.pending;
        state.pending = null;
        els.confirm.classList.remove('open');
        if (!pending) return;
        const { row, force } = pending;
        const result = await window.api.kill(row.pid, force);
        if (result.ok) {
          toast(`Killed pid ${row.pid}` + (force ? ' (SIGKILL)' : ''), 'ok');
          setTimeout(refresh, 350);
        } else {
          toast(result.error || 'Kill failed', 'err');
        }
      }

      els.filter.addEventListener('input', () => {
        state.filter = els.filter.value;
        render();
      });
      document.getElementById('quit').addEventListener('click', () => window.api.quit());
      els.refresh.addEventListener('click', refresh);
      els.auto.addEventListener('click', () => {
        state.auto = !state.auto;
        els.auto.textContent = state.auto ? 'Auto: on' : 'Auto: off';
        if (state.timer) clearInterval(state.timer);
        state.timer = state.auto ? setInterval(refresh, 3000) : null;
      });
      els.confirmCancel.addEventListener('click', () => {
        state.pending = null;
        els.confirm.classList.remove('open');
      });
      els.confirmOk.addEventListener('click', confirmKill);
      els.confirm.addEventListener('click', (e) => {
        if (e.target === els.confirm) {
          state.pending = null;
          els.confirm.classList.remove('open');
        }
      });

      window.api.platform().then((p) => {
        els.shortcut.textContent = p === 'darwin' ? '⌘⇧K' : 'Ctrl⇧K';
      });
      if (window.api.onRefresh) window.api.onRefresh(refresh);

      refresh();
    </script>
  </body>
</html>
